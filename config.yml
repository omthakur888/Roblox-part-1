TITLE: IN THIS TOWN, NOBODY IS ALLOWED TO SCREAM!

[00:00 - 00:07] SCENE 1 - THE RULE
In this town, nobody was allowed to scream. Because if you screamed... something came for you.

[00:07 - 00:15] SCENE 2 - MAYA'S PLAN
But Maya didn't believe the rule. So she decided to test it on Andy.

[00:15 - 00:25] SCENE 3 - THE HEADPHONES
Andy couldn't hear much around him. Maya secretly changed his headphones. He didn't even notice.

[00:25 - 00:40] SCENE 4 - THE EXPERIMENT
She tried everything to make him scream. But Andy didn't react. Until Maya switched off his noise cancellation...

[00:40 - 00:50] SCENE 5 - THE SCREAM
Then he heard something behind him... and screamed!

[00:50 - 00:57] SCENE 6 - COMPLETE ENDING
The monster was real. Maya escaped... but Andy was never seen again.

[ON-SCREEN FINAL TEXT]
WOULD YOU SCREAM?

name: Render video

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo files
        run: ls -R . | head -100

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional TTS
        run: pip install edge-tts

      - name: Render
        run: python render.py timeline.json -o final.mp4

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4
          if-no-files-found: error

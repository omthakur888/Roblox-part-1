name: Render video

on:
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab
  push:
    paths:
      - "timeline.json"
      - "render.py"
      - "assets/**"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional TTS
        run: pip install edge-tts

      - name: Render
        run: python render.py timeline.json -o final.mp4

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4

name: Render Roblox-inspired story

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render the complete video
        run: python render.py

      - name: Verify MP4
        run: |
          test -s output/roblox_story.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/roblox_story.mp4

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: roblox-noob-story-mp4
          path: output/roblox_story.mp4
          if-no-files-found: error
          retention-days: 14

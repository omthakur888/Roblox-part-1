name: Generate Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Blender and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check files and Blender version
        run: |
          ls -la
          blender --version

      - name: Run script with Blender
        run: |
          blender --background --python generate_short.py

      - name: Debug - Find all video files
        run: |
          echo "Listing all MP4 files:"
          find . -name "*.mp4" || true

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: roblox-short-video
          path: '**/*.mp4'
          if-no-files-found: error

name: Render Spooky Town Short

on:
  workflow_dispatch:
    inputs:
      player_name:
        description: "Username shown on the 4th plate / leaderboard"
        default: "Player123"
  push:
    paths:
      - "render_spooky.py"
      - ".github/workflows/render.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20        # fail fast instead of hanging for hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Render video (CPU only, no GPU needed)
        env:
          PLAYER_NAME: ${{ github.event.inputs.player_name || 'Player123' }}
          FPS: "24"
        run: python render_spooky.py

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: spooky-town-short
          path: spooky_town.mp4
          retention-days: 14

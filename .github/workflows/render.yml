name: Generate Roblox Short

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libx11-6 libxxf86vm1 libxfixes3 libxi6 libxrender1 libxkbcommon0 libsm6 libice6

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate video
        run: |
          python generate_short.py --mode full --clean

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: roblox-new-video
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7
